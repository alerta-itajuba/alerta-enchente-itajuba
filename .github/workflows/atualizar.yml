name: Atualizar dados

on:
  schedule:
        - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar dados
        run: python coletar.py
      - name: Salvar se mudou
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add dados.json
          git diff --staged --quiet || git commit -m "Atualiza dados"
          git push
